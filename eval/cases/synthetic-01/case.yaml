# 阶段 1 的合成用例。目的只有一个：让回放自校验在有真实用例之前就跑起来。
# 真实冻结用例（含 truth/ 与 rules.lock）是 M2 的事（07）。
id: synthetic-01
description: 一条两 turn 的 run，第一 turn 调 fs.write，第二 turn 结束
run_id: r-synthetic-01
intent: 把账龄表做出来
clock_start_ms: 1756461600000
fixtures: fixtures.json
expect:
  # 实跑出来的最终状态是 turn=1（0-indexed：env.sampled(0) -> tool_call ->
  # env.sampled(1) -> finish，effect 结算后进入 turn 1，随即 Complete，turn
  # 不再推进）。这里原来写的是 2，从来没有代码读过这个块，所以从没被
  # 拆穿——eval/run.sh 现在真的读它、断言它，参见该脚本。
  turns: 1
  checkpoints_at_least: 1
  # 三条独立的回放路径（--verify 全量 fold、走快照的 replay、删光快照后
  # 退回全量 fold 的 replay）算出的最终状态哈希必须两两相同，且必须等于
  # 这个钉住的值——eval/run.sh 逐条比对。last_seq=22。
  #
  # 这个值在 M2 Task 2（内核：挂起/恢复/预算闸门）里改过一次：`RunState`
  # 新增了 `pending_approvals`/`pending_question` 两个字段，`state_hash`
  # 把整个 RunState 序列化后取哈希，形状一变，哈希必然跟着变——这是
  # 唯一允许更新这个钉住值的情况。更新前已核对：本用例（没有任何审批/
  # 澄清/预算事件的合成场景）重新生成后的 23 条事件 kind 序列
  # （run.created ... run.completed，last_seq 仍是 22，turn 仍是 1，
  # status 仍是 Completed）与改动前逐条相同，三条回放路径的哈希也两两
  # 相同——变的只是 RunState 的形状，不是这条 Run Log 的行为。旧值是
  # 77401e44720125247809a2b3960a540e14174b7974cab93e0dcc2cd4777eab60。
  #
  # M2 终审 BL-9（接通污点闸门）**没有**改动这个值，这里记一笔，因为它
  # 看起来该改：接通之后 `RunState.taint` 在真实 run 里第一次会变成
  # `Tainted`，而 `state_hash` 把整个 `RunState` 序列化后取哈希。已在一个
  # 只含 BL-9 改动的干净工作区上重新生成核对过：三条回放路径仍是
  # 3fa28a4b…，23 条事件 kind 序列逐条相同，last_seq 仍是 22。
  #
  # 不变的原因是这条用例只调 `fs.write` 一个工具，而 `fs.write` 恰好是
  # 污点判定表里唯一的 `Clean`（`evo_exec_local` 的 `outcome_taint`：它
  # `output` 恒为 `None`，没有任何内容回流）；`tool.result` 没有
  # `output_ref`，daemon 因而也不会给下一 turn 的上下文加工具返回 block。
  # 所以这条用例从头到尾是 `Clean`，闸门一次都不该命中——这正是它该有的
  # 样子：接通污点不等于"从此每一步都要人批"。哪天这条用例改成会调
  # `fs.read` / `shell.exec`，这个值就会变，且必须连同事件 kind 序列的
  # 差异一起在这里说明。
  final_state_hash: 3fa28a4be5cd4a7339738ee31376585bec1b2ab72897766520100c3d14896427
  artifacts:
    - report.txt
