[package]
name = "evo-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
evo-protocol = { workspace = true }
evo-kernel = { workspace = true }
evo-runlog = { workspace = true }
evo-context = { workspace = true }
evo-policy = { workspace = true }
evo-gateway = { workspace = true }
evo-exec = { workspace = true }
evo-exec-local = { workspace = true }
evo-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "sync", "time", "io-util"] }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile = { workspace = true }
# 篡改快照 blob（而不是事件、也不是哈希列）是 tests/replay.rs 里
# 「被污染的快照必须被丢弃」那条测试唯一的构造手段：快照存的是 CBOR
# 编码的 RunState，要改其中一个字段就得解出来再编回去。
ciborium = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rusqlite = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = "0.3"
