packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'
  - 'tools/*'

# 显式批准需要跑安装脚本的包（pnpm 10 默认禁止）。
# 只列真正需要的：esbuild 要下载平台二进制（vitest 依赖它），其余一律不批。
onlyBuiltDependencies:
  - esbuild
  # electron 的 postinstall 下载对应平台的运行时二进制（~100MB）。不批准它的话
  # `require('electron')` 会抛 "failed to install correctly" —— 而那是在**运行时**才发现的。
  - electron
