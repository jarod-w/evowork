# EvoWork 账号/分享入口。安装到 sites-available/zz-account.nucleant.cn.conf（保留 update 作为默认 TLS 站点）。
<VirtualHost *:80>
    ServerName account.nucleant.cn
    DocumentRoot /var/www/acme
    <Directory /var/www/acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://account.nucleant.cn%{REQUEST_URI} [R=308,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/account.nucleant.cn-error.log
    CustomLog ${APACHE_LOG_DIR}/account.nucleant.cn-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName account.nucleant.cn
    DocumentRoot /opt/evowork-web/dist
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/account.nucleant.cn/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/account.nucleant.cn/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPassMatch ^(/v1/shares(?:/.*)?|/v1/s/.*|/s/.*)$ http://127.0.0.1:8790$1
    ProxyPassReverse /v1/shares http://127.0.0.1:8790/v1/shares
    ProxyPassReverse /v1/s/ http://127.0.0.1:8790/v1/s/
    ProxyPass /v1/ http://127.0.0.1:8788/v1/
    ProxyPassReverse /v1/ http://127.0.0.1:8788/v1/
    ProxyPass /healthz http://127.0.0.1:8788/healthz
    ProxyPass /readyz http://127.0.0.1:8788/readyz
    ProxyPass /.well-known/ http://127.0.0.1:8788/.well-known/
    <Directory /opt/evowork-web/dist>
        Require all granted
        Options -Indexes
        AllowOverride None
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/(v1/|s/|healthz|readyz|\.well-known/|assets/)
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [END]
    </Directory>
    <FilesMatch "\.(html|js)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>
    <Location /assets/>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>
    ErrorLog ${APACHE_LOG_DIR}/account.nucleant.cn-error.log
    CustomLog ${APACHE_LOG_DIR}/account.nucleant.cn-access.log combined
</VirtualHost>
