# 日常办公（默认场景）。03 §2.2。
#
# 场景包必须由 EvoWork 自己维护：内核的 collaborationMode/list 返回硬编码的 plan + default，
# 不读任何配置（F3），装不下场景这个概念。每次 turn/start 由适配层把它展开成完整参数下发。

id      = "office"
name    = "日常办公"
icon    = "cup"
order   = 10
default = true

# 展开到 turn/start 的部分
reasoning_effort  = "medium"
permissions       = "evowork-workspace"
mode              = "request-approval"
instructions_file = "modes/craft-office.md"
# 定时任务强制硬预算（07 §8-3）；交互式任务用它做默认值
budget_limit      = 400000

# 影响可用能力
skills              = ["documents", "spreadsheets", "presentations", "charts", "minutes", "weekly-report", "email-draft", "data-analysis", "diagrams", "scan-to-ledger"]
connectors          = ["browser"]              # Q9：本期只有 browser。写进场景说明，信任仍由用户显式完成
experts_recommended = ["report-writer", "data-analyst", "finance-analyst"]

# 影响首页（截图 1 的 5 个 chips）。点击只写入 Composer，**不自动发送**（03 §3.2）
[[chips]]
label         = "文档处理"
icon          = "file-text"
prompt        = "帮我处理这些文档："
requires_file = true

[[chips]]
label  = "金融服务"
icon   = "bank"
prompt = "帮我分析这份财务数据："

[[chips]]
label  = "数据分析及可视化"
icon   = "pie-chart"
prompt = "分析这份数据并给出可视化："

[[chips]]
label  = "个人工作台"
icon   = "layout"
prompt = "整理今天的待办，或根据材料写会议纪要："

[[chips]]
label  = "幻灯片"
icon   = "presentation"
prompt = "帮我做一份汇报幻灯片："
